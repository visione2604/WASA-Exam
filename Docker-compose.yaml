services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wasa-backend
    ports:
      - "3000:3000"
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_URL: http://localhost:3000
    container_name: wasa-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped